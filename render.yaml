services:
  # ─────────────────────────────────────────────────────────────
  #  1. Backend Web Service (Node.js + Express + Mongoose)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: coffee-shop-backend
    env: node
    plan: free
    rootDir: Backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 1000
      - key: URL
        sync: false # Set your MongoDB Atlas URI in Render dashboard
      - key: SECRET
        generateValue: true # Generates a secure random JWT secret
      - key: CLIENT_URL
        sync: false # Set to your deployed Frontend URL (e.g. https://coffee-shop-frontend.onrender.com)
      - key: BACKEND_URL
        sync: false # Set to your deployed Backend URL (e.g. https://coffee-shop-backend.onrender.com)
      - key: GOOGLE_CLIENT_ID
        sync: false # Optional Google OAuth ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Optional Google OAuth Secret

  # ─────────────────────────────────────────────────────────────
  #  2. Frontend Static Site (React + Vite + Tailwind)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: coffee-shop-frontend
    env: static
    plan: free
    rootDir: Frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to your deployed Backend URL (e.g. https://coffee-shop-backend.onrender.com)

